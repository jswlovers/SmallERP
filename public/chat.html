<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 예약 도우미</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height:100%; background:#f5f6f8; }
  #wrap { max-width:520px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; }
  header.chead { padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header.chead h1 { font-size:16px; margin:0; flex:1; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--pri); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.typing { color:var(--muted); }
  form.cinput { display:flex; gap:8px; padding:10px; background:#fff; border-top:1px solid var(--line); }
  form.cinput input { flex:1; margin:0; }
  form.cinput button { flex:0 0 auto; }
</style>
</head>
<body>
<div id="wrap">
  <header class="chead"><h1 id="title">AI 예약 도우미</h1><a class="link" id="toForm" href="#">폼으로 예약</a></header>
  <div id="log"></div>
  <form class="cinput" id="f"><input id="input" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="500" required><button class="primary">보내기</button></form>
</div>
<div id="toast"></div>
<script type="module" src="chat.js"></script>
</body>
</html>
