<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인 예약</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  body { background:#f5f6f8; }
  #root { max-width:520px; margin:0 auto; padding:16px; }
  .bhead { text-align:center; padding:18px 0 6px; }
  .bhead h1 { font-size:22px; margin:4px 0; }
  .otpbox { display:flex; gap:8px; }
  .otpbox input { text-align:center; letter-spacing:4px; font-size:20px; }
  .slotwrap { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .slot.on { border-color:var(--pri); background:var(--pri); color:#fff; }
  .svcopt { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .svcopt:last-child { border-bottom:0; }
  .notice { background:#fff4dd; color:#a26a00; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:14px; }
  .devcode { color:var(--muted); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script type="module" src="book.js"></script>
</body>
</html>
